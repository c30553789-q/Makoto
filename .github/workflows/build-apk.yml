name: Build Makoto APK

on:
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "Tag de llama.cpp (ej. b10502)"
        required: false
        default: "b10502"
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  LLAMA_CPP_REF: ${{ inputs.llama_cpp_ref || 'b10502' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unpack project ZIP
        run: |
          if [ -f Makoto_0.3.zip ]; then
            echo "Unpacking Makoto_0.3.zip"
            unzip -o Makoto_0.3.zip -d _unpack
            if [ -d _unpack/makoto_0.3 ]; then
              cp -a _unpack/makoto_0.3/. .
            elif [ -d _unpack/Makoto_0.3 ]; then
              cp -a _unpack/Makoto_0.3/. .
            else
              cp -a _unpack/. .
            fi
          fi
          ls -la
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages (NDK + CMake)
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch llama.cpp
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 --branch "$LLAMA_CPP_REF" \
            https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          git -C app/src/main/cpp/llama.cpp log -1 --oneline

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makoto-0.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
